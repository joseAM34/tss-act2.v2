<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="panel" class="live-panel" th:if="${!workspace.legacy}" th:attr="data-live-url=@{/admin/espacio/{slug}/resultados/actuales(slug=${workspace.slug},version=${workspace.selected.code},origin=${liveOrigin},from=${liveFrom},until=${liveUntil},row=${liveRow},column=${liveColumn})},data-live-initial=${liveInitial}">
  <h2>Resultados actualizados</h2><p>Consulta automática cada 30 segundos mientras esta pestaña está visible. El origen y período elegidos se conservan.</p>
  <form class="live-filters" th:action="${workspace.path() + '/resultados'}" method="get"><input type="hidden" name="version" th:value="${workspace.selected.code}"><div><label for="live-origin">Origen</label><select id="live-origin" name="origin"><option value="NO_DECLARADO" th:selected="${liveOrigin == 'NO_DECLARADO'}">Sin verificar</option><option value="REAL" th:selected="${liveOrigin == 'REAL'}">Real revisado</option><option value="SINTETICO" th:selected="${liveOrigin == 'SINTETICO'}">Sintético</option></select></div><div><label for="live-from">Recepción desde</label><input id="live-from" name="from" type="date" th:value="${liveFrom}"></div><div><label for="live-until">Recepción hasta</label><input id="live-until" name="until" type="date" th:value="${liveUntil}"></div>
  <div><label for="live-row">Cruce: filas</label><select id="live-row" name="row"><option value="">Sin cruce</option><th:block th:if="${liveFrame != null}"><option th:each="v : ${liveFrame.result.variables}" th:if="${v.type == 'radio' or v.type == 'select'}" th:value="${v.question_id}" th:text="${v.label}" th:selected="${v.question_id == liveRow}"></option></th:block></select></div><div><label for="live-column">Cruce: columnas</label><select id="live-column" name="column"><option value="">Sin cruce</option><th:block th:if="${liveFrame != null}"><option th:each="v : ${liveFrame.result.variables}" th:if="${v.type == 'radio' or v.type == 'select'}" th:value="${v.question_id}" th:text="${v.label}" th:selected="${v.question_id == liveColumn}"></option></th:block></select></div><button class="button button-primary" type="submit">Aplicar selección</button></form>
  <div class="download-links"><button class="button button-outline" type="button" data-live-refresh hidden>Actualizar ahora</button><label class="draft-checkbox" data-live-toggle-label hidden><input type="checkbox" data-live-toggle checked>Actualización automática</label><a class="text-link" th:href="@{/admin/preparacion(versionId=${workspace.selected.id})}">Elegir variables y unidades →</a></div>
  <p class="workspace-notice" role="status" data-live-status th:text="${liveError != null ? liveError : 'Consulta completada. El corte mostrado identifica los datos de las tablas y gráficos.'}"></p>
  <div data-live-content><div th:if="${liveFrame != null}" th:with="frame=${liveFrame}"><div th:replace="~{fragments/live-results :: content}"></div></div></div>
  <form data-live-save th:action="@{/admin/espacio/{slug}/resultados/guardar(slug=${workspace.slug})}" method="post"><input type="hidden" name="version" th:value="${workspace.selected.code}"><input type="hidden" name="origin" th:value="${liveOrigin}"><input type="hidden" name="from" th:value="${liveFrom}"><input type="hidden" name="until" th:value="${liveUntil}"><input type="hidden" name="row" th:value="${liveRow}"><input type="hidden" name="column" th:value="${liveColumn}"><input type="hidden" name="expectedHash" th:value="${liveFrame != null ? liveFrame.hash : ''}"><button type="submit" class="button button-primary" disabled data-live-save-button>Guardar este corte</button><button type="submit" class="button button-outline" disabled data-live-report-button>Generar reporte de este corte</button><p data-live-saved role="status"></p></form>
  <noscript><p>Aplica la selección para consultar un corte actualizado. La preparación y el guardado manual de análisis siguen disponibles debajo.</p></noscript>
  <script defer th:src="@{/vendor/echarts-6.0.0.min.js}"></script><script defer th:src="@{/js/live-results.js}"></script>
</section>
</body></html>
