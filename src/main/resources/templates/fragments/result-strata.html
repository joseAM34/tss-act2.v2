<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body><details th:fragment="strata(result)" th:if="${result['strata'] != null}" class="result-strata"><summary>Consultar resultados separados por origen</summary><section th:each="stratum : ${result.strata}"><h3 th:text="${(stratum.origin == 'REAL' ? 'Real revisado' : stratum.origin == 'SINTETICO' ? 'Sintético' : 'Sin verificar') + ' · ' + stratum.submission_count + ' envíos'}"></h3><div th:each="v : ${stratum.variables}" class="table-scroll"><table><caption th:text="${v.label + ' · con valor: ' + v.answered + ' · sin respuesta: ' + v.missing + ' · no aplica: ' + v.not_applicable}"></caption><thead><tr><th>Opción / medida</th><th>Valor</th><th>Base</th></tr></thead><tbody><th:block th:if="${v.numeric == null}"><tr th:each="o : ${v.distribution}"><td th:text="${o.label}"></td><td th:text="${o.count}"></td><td th:text="${o.respondent_base}"></td></tr></th:block><th:block th:if="${v.numeric != null}"><tr th:each="m : ${ {'min','max','mean','median','sample_standard_deviation'} }"><td th:text="${m}"></td><td th:text="${v.numeric[#vars.m] == null ? 'Sin datos suficientes' : #numbers.formatDecimal(v.numeric[#vars.m],1,'NONE',2,'POINT')}"></td><td th:text="${v.numeric.n}"></td></tr></th:block></tbody></table><div th:replace="~{fragments/descriptive-profile :: profile(${v})}"></div></div></section></details></body></html>
