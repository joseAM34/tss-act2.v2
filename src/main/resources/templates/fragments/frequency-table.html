<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="table(v)" th:if="${v.numeric == null}" th:with="multiple=${v.type == 'checkbox'}" class="frequency-summary">
  <div class="table-scroll"><table><caption th:text="${(v['coverage_only'] == true ? 'Frecuencias de cobertura: ' : 'Tabla de frecuencias: ') + v.label}"></caption><thead><tr>
    <th scope="col">Opción / estado</th><th scope="col">Frecuencia absoluta (fi)</th><th scope="col">Base de cálculo (n)</th><th scope="col">Frecuencia relativa (hi)</th><th scope="col">Porcentaje (%)</th>
    <th scope="col" th:if="${multiple}">Total de selecciones (m)</th><th scope="col" th:if="${multiple}">Frecuencia relativa por selección</th><th scope="col" th:if="${multiple}">Porcentaje por selección (%)</th>
  </tr></thead><tbody><tr th:each="r : ${T(bo.edu.umss.mercado.reporting.FrequencyPresentation).rows(v)}">
    <td th:text="${r.label}"></td><td th:text="${r.count}"></td><td th:text="${r.base == null ? 'Sin base' : r.base}"></td><td th:text="${r.relative == null ? 'Sin base' : #numbers.formatDecimal(r.relative,1,'NONE',4,'POINT')}"></td><td th:text="${r.percent == null ? 'Sin base' : #numbers.formatDecimal(r.percent,1,'NONE',2,'POINT')}"></td>
    <td th:if="${multiple}" th:text="${r.selections == null ? 'Sin base' : r.selections}"></td><td th:if="${multiple}" th:text="${r.selectionRelative == null ? 'Sin base' : #numbers.formatDecimal(r.selectionRelative,1,'NONE',4,'POINT')}"></td><td th:if="${multiple}" th:text="${r.selectionPercent == null ? 'Sin base' : #numbers.formatDecimal(r.selectionPercent,1,'NONE',2,'POINT')}"></td>
  </tr></tbody></table></div>
  <p class="field-hint" th:text="${T(bo.edu.umss.mercado.reporting.FrequencyPresentation).HELP}"></p>
  <p class="field-hint" th:if="${multiple}" th:text="${T(bo.edu.umss.mercado.reporting.FrequencyPresentation).MULTIPLE_HELP}"></p>
</section>
</body></html>
