<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Análisis generales')}"></head>
<body><header th:replace="~{fragments/layout :: header('admin')}"></header><div th:replace="~{fragments/layout :: adminBar}"></div><main class="container page-main draft-editor" id="contenido"><h1>Análisis generales guardados</h1><p>Para crear uno, abre un conjunto en <a class="text-link" th:href="@{/admin/preparacion}">Preparación de encuestas nuevas</a>.</p><ul><li th:each="a : ${analyses}"><a class="text-link" th:href="@{/admin/analisis-general/{id}(id=${a.id})}" th:text="${a.title + ' · ' + a.version + ' · ' + a.origin + ' · ' + a.createdAt}"></a></li></ul></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
