<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${content.template.title}">Reporte</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/survey-editor.css}"><script th:if="${content.template.charts}" defer th:src="@{/vendor/echarts-6.0.0.min.js}"></script><script defer th:src="@{/js/report-downloads.js}"></script><script defer th:src="@{/js/report-charts.js}"></script><script defer th:src="@{/js/generated-report.js}"></script><link rel="stylesheet" th:href="@{/css/report-presentation.css}"><script defer th:src="@{/js/report-guides.js}"></script></head><body><header th:replace="~{fragments/layout :: header('admin')}"></header><div th:replace="~{fragments/layout :: adminBar}"></div>
<main class="container page-main draft-editor" id="contenido" th:attr="data-report-url=@{/admin/reportes/{id}/contenido.json(id=${report.id})}"><a class="back-link" th:href="${workspace != null ? workspace.link('reportes') : '/admin/reportes'}">← Reportes</a><div class="draft-actions"><a class="button button-outline" th:href="@{/admin/reportes/{id}/nuevo(id=${report.id})}">Generar otro con estas fuentes</a></div><div th:replace="~{fragments/report-downloads :: controls}"></div><div th:replace="~{fragments/report-document :: documentContent(${content},${report})}"></div><section class="review-card"><h2>Trazabilidad del reporte</h2><p>Editar la plantilla o generar otro reporte conserva este documento. Las cifras no se editan manualmente.</p><p>Huella del contenido: <code class="content-hash" th:text="${report.logical_hash}"></code></p><p>Plantilla: <code class="content-hash" th:text="${content.template_hash}"></code></p><p>Fuente: <code class="content-hash" th:text="${content.analysis.source_hash}"></code></p><p>Análisis: <code class="content-hash" th:text="${content.analysis.result_hash}"></code></p><a class="text-link" th:href="@{/admin/reportes/{id}/contenido.json(id=${report.id})}">Contenido y fuentes congeladas JSON</a></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
