<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Editar plantilla de reporte')}"></head><body><header th:replace="~{fragments/layout :: header('admin')}"></header><div th:replace="~{fragments/layout :: adminBar}"></div><main class="container page-main draft-editor" id="contenido"><a class="back-link" th:href="${workspace != null ? workspace.link('reportes') : '/admin/reportes'}">← Reportes</a><h1>Plantilla de reporte</h1><p th:text="${'Revisión actual: ' + expectedRevision + '. Guardar crea una revisión nueva.'}"></p><div class="alert alert-error" th:if="${error != null}" th:text="${error}" role="alert"></div>
<form class="data-form review-card" th:action="@{/admin/reportes/plantillas}" method="post"><input th:if="${workspace != null}" type="hidden" name="workspaceVersionId" th:value="${workspace.selected.id}"><input type="hidden" name="templateId" th:value="${templateId}"><input type="hidden" name="expectedRevision" th:value="${expectedRevision}"><label for="title">Título del reporte</label><input id="title" name="title" th:value="${definition.title}" maxlength="200" required><label for="introduction">Introducción (opcional)</label><textarea id="introduction" name="introduction" rows="4" maxlength="4000" th:text="${definition.introduction}"></textarea>
<div th:each="position : ${#numbers.sequence(1,4)}"><label th:for="${'section' + position}" th:text="${'Sección en posición ' + position}"></label><select th:id="${'section' + position}" th:name="${'section' + position}"><option value="">Omitir</option><option th:each="s : ${sections}" th:value="${s}" th:text="${s}" th:selected="${#lists.size(definition.sections) >= position and definition.sections[position - 1] == s}"></option></select></div>
<p>No repitas secciones. Puedes omitirlas y elegir su orden. Los comentarios se escriben al generar cada reporte; las cifras no se editan aquí.</p><label class="draft-checkbox"><input name="charts" value="true" type="checkbox" th:checked="${definition.charts}">Mostrar gráficos junto a sus tablas</label><button class="button button-primary" type="submit">Guardar nueva revisión</button></form>
<section class="review-card" th:if="${history != null}"><h2>Historial conservado</h2><ul><li th:each="r : ${history}"><a class="text-link" th:href="@{/admin/reportes/nuevo(templateRevisionId=${r.id})}" th:text="${r.definition.title + ' · revisión ' + r.revision + ' · ' + r.actor + ' · ' + r.createdAt}"></a></li></ul></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
