<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Respuestas de la pregunta')}"></head>
<body><header th:replace="~{fragments/layout :: header('admin')}"></header><div th:replace="~{fragments/layout :: adminBar}"></div>
<main class="container page-main workspace-results" id="contenido"><a class="back-link" th:href="${back}">← Volver a Resultados</a><h1 th:text="${answers.label}"></h1><p>Respuestas de la vista cargada. Cada fila corresponde a un envío; recepción en hora de Bolivia.</p><section class="review-card"><div class="individual-answer-scroll"><table><thead><tr><th>Respuesta</th><th>Estado</th><th>Recepción</th><th>Versión</th><th>Envío</th></tr></thead><tbody><tr th:each="r : ${answers.rows}"><td th:text="${r.value}"></td><td th:text="${r.state}"></td><td th:text="${#temporals.format(T(java.time.Instant).parse(r.submittedAt).atZone(T(java.time.ZoneId).of('America/La_Paz')), 'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.version}"></td><td><a th:href="@{/admin/respuestas/{id}(id=${r.id})}">Ver envío →</a></td></tr></tbody></table><p th:if="${#lists.isEmpty(answers.rows)}">No hay envíos en esta vista.</p></div></section></main><link rel="stylesheet" th:href="@{/css/workspace-results.css}"><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
