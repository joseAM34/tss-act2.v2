<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Reportes y plantillas')}"></head><body><header th:replace="~{fragments/layout :: header('admin')}"></header><div th:replace="~{fragments/layout :: adminBar}"></div><main class="container page-main draft-editor" id="contenido"><a class="back-link" th:href="@{/admin}">← Panel</a><h1>Reportes y plantillas</h1><p>Las cifras proceden de análisis guardados. Editar una plantilla crea otra revisión; los reportes anteriores se conservan.</p><div class="draft-actions"><a class="button button-primary" th:href="@{/admin/reportes/plantillas/nueva}">Crear plantilla</a><a class="button button-outline" th:href="@{/admin/reportes/nuevo}">Generar reporte</a></div>
<section class="review-card"><h2>Revisiones de plantillas</h2><ul><li th:each="r : ${revisions}"><strong th:text="${r.definition.title + ' · revisión ' + r.revision}"></strong> <a class="text-link" th:href="@{/admin/reportes/plantillas/{id}/editar(id=${r.templateId})}">Editar última revisión</a> · <a class="text-link" th:href="@{/admin/reportes/nuevo(templateRevisionId=${r.id})}">Usar esta revisión</a></li></ul></section><section class="review-card"><h2>Reportes generados</h2><ul><li th:each="r : ${reports}"><a class="text-link" th:href="@{/admin/reportes/{id}(id=${r.id})}" th:text="${r.title + ' · ' + r.createdAt}"></a></li></ul></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
