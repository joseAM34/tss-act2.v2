spring.application.name=estudio-mercado-umss
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/estudio_mercado}
spring.datasource.username=${DATABASE_USERNAME:estudio_mercado}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.setup.local-enabled=false
