services:
  - type: web
    name: estudio-mercado-umss
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
